[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sanchezts-logmask"
version = "0.1.0"
description = "在同一个输入里两两比对，检测日志中的提示词脱敏相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sanchezts" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sanchezts.github.io"
Repository = "https://github.com/sanchezts/logmask"
Issues = "https://github.com/sanchezts/logmask/issues"

[project.scripts]
logmask = "logmask:main"

[tool.setuptools]
py-modules = ["logmask"]
